physics:
    forward_operator: fft2
    backward_operator: ifft2
training:
    datasets:
        -
            name: CMRxRecon2025
            kspace_context: time
            text_description: prod_1000k_to_1100k_max_204x518_2025_CartesianEquispaced
            filenames_lists:
                - ../lists/prod_1000k_to_1100k_max_204x518_2025.lst
            kspace_key: kspace
            transforms:
                pad: [518, 204]
                padding_eps: 0.0
                crop: [363, 143]
                estimate_sensitivity_maps: true
                scaling_key: masked_kspace
                image_center_crop: false
                random_flip_probability: 0.25
                random_reverse_probability: 0.25
                compress_coils: null
                masking:
                    name: CartesianEquispaced
                    accelerations: [4, 6, 8]
                    center_fractions: [20, 18, 14]
                scale_percentile: null
                use_seed: false
                delete_kspace: false
    optimizer: Adam
    lr: 0.002
    weight_decay: 0
    batch_size: 1
    lr_step_size: 50000
    lr_gamma: 0.9
    lr_warmup_iter: 3000
    num_iterations: 2000000
    validation_steps: 12000
    gradient_steps: 1
    gradient_clipping: 200.0
    gradient_debug: false
    loss:
        crop: null
        losses:
            -
                function: l1_loss
                multiplier: 1
            -
                function: ssim_loss
                multiplier: 1
            -
                function: ssim_3d_loss
                multiplier: 1
            -
                function: grad_l2_loss
                multiplier: 0.5
            -
                function: kspace_nrmse_loss
                multiplier: 0.5
    checkpointer:
        checkpoint_steps: 1000
validation:
    datasets:
        -
            name: CMRxRecon2025
            kspace_context: time
            text_description: test-4x-radial
            transforms:
                padding_eps: 0.0
                estimate_sensitivity_maps: true
                scaling_key: masked_kspace
                image_center_crop: false
                random_flip_probability: 0
                random_reverse_probability: 0
                masking:
                    name: KtRadial
                    accelerations: [4]
                    center_fractions: [20]
                scale_percentile: null
                use_seed: false
                delete_kspace: false
            kspace_key: kspace_full
    batch_size: 1
    metrics:
        - fastmri_ssim
        - fastmri_psnr
    crop: null
model:
    model_name: vsharp.vsharp.VSharpNet3D
    num_steps: 14
    num_steps_dc_gd: 8
    image_init: INPUT_IMAGE
    no_parameter_sharing: true
    auxiliary_steps: -1
    unet_num_filters: 32
    unet_num_pool_layers: 4
    initializer_channels:
        - 32
        - 64
        - 64
    initializer_dilations:
        - 1
        - 2
        - 4
    initializer_multiscale: 1
additional_models:
    sensitivity_model:
        model_name: unet.unet_2d.UnetModel2d
        in_channels: 2
        out_channels: 2
        num_filters: 32
        num_pool_layers: 4
        dropout_probability: 0
    auxiliary_kspace_model:
        model_name: varnet.varnet.EndToEndVarNet3D
        num_layers: 6
        regularizer_num_filters: 24
        regularizer_num_pull_layers: 4
logging:
    tensorboard:
        num_images: 4
inference:
    batch_size: 1
    dataset:
        name: CMRxRecon2025
        kspace_key: kus
        compute_mask: true
        kspace_context: time
        acs_type: auto
        transforms:
            cropping:
                crop: null
            sensitivity_map_estimation:
                estimate_sensitivity_maps: true
            normalization:
                scaling_key: masked_kspace
                scale_percentile: null
            masking: null
            use_seed: true
        text_description: inference
    crop: null
