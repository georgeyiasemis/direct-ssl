        -
            name: CMRxRecon2025
            kspace_context: time
            text_description: prod_1000k_to_1100k_max_204x518_2023_2024_CartesianEquispaced
            filenames_lists:
                - ../lists/prod_1000k_to_1100k_max_204x518_2023_2024.lst
            kspace_key: kspace_full
            transforms:
                pad: [518, 204]
                padding_eps: 0.0
                crop: [518, 204]
                estimate_sensitivity_maps: true
                scaling_key: masked_kspace
                image_center_crop: false
                random_flip_probability: 0.5
                random_reverse_probability: 0.5
                masking:
                    name: CartesianEquispaced
                    accelerations: [4, 6, 8, 10, 12]
