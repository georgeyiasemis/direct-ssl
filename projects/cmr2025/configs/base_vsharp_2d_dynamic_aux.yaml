    optimizer: Adam
    lr: 0.002
    weight_decay: 0
    batch_size: 1
    lr_step_size: 50000
    lr_gamma: 0.95
    lr_warmup_iter: 4000
    num_iterations: 2000000
    validation_steps: 1999999
    gradient_steps: 1
    gradient_clipping: 100.0
    gradient_debug: false
    loss:
        crop: null
        losses:
            -
                function: l1_loss
                multiplier: 1
            -
                function: ssim_loss
                multiplier: 1
            -
                function: ssim_3d_loss
                multiplier: 1
            -
                function: kspace_nmae_loss
                multiplier: 1
    checkpointer:
        checkpoint_steps: 1000
validation:
    datasets:
        -
            name: CMRxRecon2025
            kspace_context: time
            text_description: shape_50_or_35_max_159x384_2025_val
            filenames_lists:
                - ../lists/shape_50_or_35_max_159x384_2025.lst
            transforms:
                padding_eps: 0.0
                estimate_sensitivity_maps: true
                scaling_key: masked_kspace
                image_center_crop: false
                random_flip_probability: 0
                random_reverse_probability: 0
                masking:
                    name: CartesianEquispaced
                    accelerations: [4]
                    center_fractions: [20]
                scale_percentile: 0.995
                use_seed: false
                delete_kspace: false
            kspace_key: kspace
    batch_size: 1
    metrics:
        - fastmri_ssim
        - fastmri_psnr
    crop: null
model:
    model_name: vsharp.vsharp.VSharpNet3D
    num_steps: 10
    num_steps_dc_gd: 6
    image_init: INPUT_IMAGE
    no_parameter_sharing: true
    auxiliary_steps: -1
    unet_num_filters: 32
    unet_num_pool_layers: 4
    initializer_channels:
        - 32
        - 32
        - 64
        - 64
    initializer_dilations:
        - 1
        - 1
        - 2
        - 4
    initializer_multiscale: 1
additional_models:
    sensitivity_model:
        model_name: unet.unet_2d.UnetModel2d
        in_channels: 2
        out_channels: 2
        num_filters: 32
        num_pool_layers: 4
        dropout_probability: 0
    auxiliary_kspace_model:
        model_name: varnet.varnet.EndToEndVarNet3D
        num_layers: 6
        regularizer_num_filters: 16
        regularizer_num_pull_layers: 4
logging:
    tensorboard:
        num_images: 4
